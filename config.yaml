# OpenAloha DevPod Configuration Example
# 使用方法: ./openaloha-devpod -config=config.yaml

# 工作空间路径
workspace: "/Users/Shared/Projects/openaloha/openaloha-sidecar-test"

# 同步配置
sync:
  type: "git"
  git:
    url: "https://github.com/openaloha/openaloha-test"
    branch: "main"
    sync-interval: "30s"

# 运行配置
run:
  # 初始化命令
  init:
    cmds:
      - "cd openaloha-front-test/openaloha-front-vue-test && npm install && npm run dev"
  
  # 刷新命令配置
  refresh:
    - condition: "*.vue"
    - condition: "package.json"
      cmds:
        - "cd openaloha-front-test/openaloha-front-vue-test && npm install && npm run dev"

  coding:
    type: gemini
    gemini:
      baseurl: https://google.com
      apikey: sk-xxxx